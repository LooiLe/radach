spring.application.name=maps
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=none

# JWT
# JWT_SECRET must be at least 32 characters for HS256.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Refresh tokens
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ─── Actuator / Observability ───
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}

# ─── Resend (transactional email) ───
app.resend.api-key=${RESEND_API_KEY}
app.resend.from-email=${RESEND_FROM:onboarding@resend.dev}

app.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:5}

# ─── File Uploads ───
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
app.upload.dir=${UPLOAD_DIR:uploads}

# ─── Stripe ───
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# Pay-per-generation price (in cents — 199 = $1.99)
app.stripe.itinerary-price-cents=${STRIPE_ITINERARY_PRICE_CENTS:199}

# Credit pack prices (in cents) and quantities
app.stripe.credit-pack-small-cents=${STRIPE_CREDIT_PACK_SMALL_CENTS:799}
app.stripe.credit-pack-small-qty=${STRIPE_CREDIT_PACK_SMALL_QTY:5}
app.stripe.credit-pack-large-cents=${STRIPE_CREDIT_PACK_LARGE_CENTS:1299}
app.stripe.credit-pack-large-qty=${STRIPE_CREDIT_PACK_LARGE_QTY:10}

# Subscriptions (Stripe Price IDs — set actual $ amounts in Stripe Dashboard)
app.stripe.pro-price-id=${STRIPE_PRO_PRICE_ID:price_pro_placeholder}
app.stripe.pro-generations-limit=${STRIPE_PRO_GEN_LIMIT:5}
app.stripe.unlimited-price-id=${STRIPE_UNLIMITED_PRICE_ID:price_unlimited_placeholder}

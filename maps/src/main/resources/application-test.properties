spring.application.name=maps-test

# Isolated in-memory database for tests.
spring.datasource.url=jdbc:h2:mem:maps_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

app.jwt.secret=test-secret-key-must-be-at-least-256-bits-long
app.jwt.expiration-ms=86400000

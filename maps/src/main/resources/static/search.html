<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search — Radach</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root { --paper:#F7F3EE; --ink:#1C1C1C; --muted:#756E66; --line:#E8E2DA; --brand:#C4623A; --brand-dark:#A8502F; --ok:#2D7A40; --card:#FFFFFF; }
    body { min-height:100vh; font-family:'DM Sans',sans-serif; background:var(--paper); color:var(--ink); }
    .topbar { height:72px; padding:0 32px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); background:rgba(247,243,238,0.96); position:sticky; top:0; z-index:100; }
    .topbar-left { display:flex; align-items:center; gap:16px; }
    .topbar h2 { font-family:'Playfair Display',serif; font-size:1.3rem; font-weight:900; }
    .hamburger { background:none; border:none; font-size:1.6rem; cursor:pointer; padding:4px; border-radius:8px; display:flex; align-items:center; justify-content:center; width:40px; height:40px; transition:background 0.15s; }
    .hamburger:hover { background:var(--line); }
    .topbar-actions { display:flex; gap:10px; align-items:center; }
    button, .link-button { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:8px; padding:10px 14px; font:inherit; font-size:0.9rem; font-weight:700; cursor:pointer; text-decoration:none; }
    button:hover, .link-button:hover { border-color:var(--ink); }
    .primary { background:var(--brand); border-color:var(--brand); color:#fff; }
    .primary:hover { background:var(--brand-dark); border-color:var(--brand-dark); }
    .menu-overlay { display:none; position:fixed; inset:0; z-index:200; }
    .menu-overlay.open { display:block; }
    .menu-dropdown { position:fixed; top:72px; left:0; z-index:201; background:#fff; border-right:1px solid var(--line); border-bottom:1px solid var(--line); border-radius:0 0 12px 0; box-shadow:4px 4px 20px rgba(0,0,0,0.1); padding:12px 0; min-width:200px; display:none; flex-direction:column; }
    .menu-dropdown.open { display:flex; }
    .menu-link { display:flex; align-items:center; gap:12px; padding:14px 20px; text-decoration:none; color:var(--muted); font-size:0.9rem; font-weight:600; transition:all 0.12s; border:none; background:none; width:100%; text-align:left; font-family:'DM Sans',sans-serif; cursor:pointer; }
    .menu-link:hover { background:#f5f0ea; color:var(--ink); }
    .menu-link.active { color:var(--brand); }
    .menu-link .icon { font-size:1.1rem; }
    .menu-divider { height:1px; background:var(--line); margin:6px 12px; }
    .logo { display:flex; align-items:center; text-decoration:none; }
    .logo-img { height:36px; width:auto; display:block; }
    main { max-width:1120px; margin:0; padding:36px 32px 64px; }
    .search-wrapper { position:relative; margin-bottom:24px; }
    .search-bar { display:flex; gap:12px; }
    .search-bar input { flex:1; border:1px solid var(--line); border-radius:8px; padding:14px 16px; font:inherit; font-size:1rem; background:#fff; outline:none; }
    .search-bar input:focus { border-color:var(--ink); box-shadow:0 0 0 3px rgba(28,28,28,0.07); }
    .autocomplete-dropdown { position:absolute; top:100%; left:0; right:60px; z-index:1000; margin-top:2px; background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,0.12); max-height:280px; overflow-y:auto; display:none; }
    .autocomplete-dropdown.open { display:block; }
    .autocomplete-item { display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer; transition:background 0.1s; border-bottom:1px solid #f0ece6; }
    .autocomplete-item:last-child { border-bottom:none; }
    .autocomplete-item:hover, .autocomplete-item.highlighted { background:#f5f0ea; }
    .autocomplete-item .name { font-weight:600; font-size:0.92rem; }
    .autocomplete-item .addr { font-size:0.8rem; color:var(--muted); }
    .autocomplete-item .type-pill { flex-shrink:0; font-size:0.68rem; font-weight:600; text-transform:uppercase; padding:2px 7px; border-radius:999px; background:var(--paper); color:var(--muted); border:1px solid var(--line); }
    .autocomplete-empty, .autocomplete-loading { padding:16px; text-align:center; color:var(--muted); font-size:0.88rem; }
    .status { min-height:22px; color:var(--muted); font-size:0.92rem; margin-bottom:16px; }
    .grid { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:16px; }
    .spot { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:18px; display:flex; flex-direction:column; gap:12px; min-height:190px; cursor:pointer; transition:border-color 0.2s, transform 0.15s; }
    .spot:hover { border-color:var(--brand); transform:translateY(-2px); }
    .spot-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
    .spot h2 { font-family:'Playfair Display',serif; font-size:1.25rem; line-height:1.15; }
    .pill { flex:0 0 auto; border:1px solid #D7E9DB; color:var(--ok); background:#EFF9F0; border-radius:999px; padding:5px 9px; font-size:0.72rem; font-weight:700; text-transform:uppercase; }
    .meta { color:var(--muted); line-height:1.45; font-size:0.92rem; }
    .coords { font-size:0.82rem; color:var(--muted); }
    .tags { display:flex; flex-wrap:wrap; gap:7px; margin-top:auto; }
    .tag { border:1px solid var(--line); border-radius:999px; padding:5px 9px; font-size:0.78rem; color:var(--muted); }
    .highlight { background:#FFF3D6; padding:0 2px; font-weight:700; }
    .empty { border:1px dashed var(--line); border-radius:8px; padding:32px; text-align:center; color:var(--muted); background:rgba(255,255,255,0.55); }
    @media (max-width:820px) { main { padding:24px 16px; } .grid { grid-template-columns:1fr; } .autocomplete-dropdown { right:0; } }
  </style>
</head>
<body>
  <div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>
  <nav class="menu-dropdown" id="menuDropdown">
    <a href="/spots" class="menu-link"><span class="icon">📍</span>All Spots</a>
    <a href="/trending" class="menu-link"><span class="icon">🔥</span>Trending</a>
    <a href="/search" class="menu-link active"><span class="icon">🔍</span>Search</a>
    <div class="menu-divider"></div>
    <a href="/admin/dashboard" class="menu-link" id="menuAdminLink" style="display:none"><span class="icon">⚙️</span>Admin</a>
    <a href="/admin/users" class="menu-link" id="menuSuperAdminLink" style="display:none"><span class="icon">👥</span>Manage Users</a>
    <div class="menu-divider"></div>
    <button class="menu-link" id="menuLogoutBtn"><span class="icon">🚪</span>Sign out</button>
  </nav>

  <div>
    <div class="topbar">
      <div class="topbar-left">
        <button class="hamburger" onclick="toggleMenu()">☰</button>
        <a href="/" class="logo">
          <img src="/images/radach_logo.jpg" alt="Radach Logo" class="logo-img">
        </a>
      </div>
      <div class="topbar-actions">
        <span id="roleBadge" style="font-size:0.78rem; padding:4px 10px; border-radius:999px; background:var(--line); font-weight:700; display:none;"></span>
      </div>
    </div>

    <main>
      <div class="search-wrapper">
        <form class="search-bar" id="searchForm" autocomplete="off">
          <input id="query" type="text" placeholder="Search spots by name or tag..." autofocus />
          <button type="submit" class="primary">Search</button>
        </form>
        <div class="autocomplete-dropdown" id="autocompleteDropdown"></div>
      </div>
      <p class="status" id="status">Enter a query above to find spots.</p>
      <section class="grid" id="spotsGrid"></section>
    </main>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const statusEl = document.getElementById('status');
    const gridEl = document.getElementById('spotsGrid');
    const queryInput = document.getElementById('query');
    const dropdownEl = document.getElementById('autocompleteDropdown');

    let autocompleteTimer = null, highlightIndex = -1, autocompleteResults = [];

    if (!token) { window.location.replace('/login'); }

    function toggleMenu() { document.getElementById('menuDropdown').classList.toggle('open'); document.getElementById('menuOverlay').classList.toggle('open'); }
    function closeMenu() { document.getElementById('menuDropdown').classList.remove('open'); document.getElementById('menuOverlay').classList.remove('open'); }

    document.getElementById('menuLogoutBtn').addEventListener('click', () => {
      localStorage.removeItem('token'); localStorage.removeItem('userId'); localStorage.removeItem('role');
      document.cookie = 'token=; path=/; max-age=0; SameSite=Strict';
      window.location.replace('/login');
    });

    (function() {
      let role = (localStorage.getItem('role') || '').toUpperCase();
      if (role !== 'ADMIN' && role !== 'SUPER_ADMIN') {
        try { const p = token.split('.'); const pl = JSON.parse(atob(p[1])); role = (pl.role || '').toUpperCase(); } catch(e) {}
      }
      if (role === 'ADMIN' || role === 'SUPER_ADMIN') { document.getElementById('menuAdminLink').style.display = ''; localStorage.setItem('role', role); }
      if (role === 'SUPER_ADMIN') { document.getElementById('menuSuperAdminLink').style.display = ''; }
      if (role) { const b = document.getElementById('roleBadge'); b.textContent = '🔑 ' + role; b.style.display = ''; }
    })();

    document.getElementById('searchForm').addEventListener('submit', e => { e.preventDefault(); closeDropdown(); const q = queryInput.value.trim(); if (q) doSearch(q); });

    queryInput.addEventListener('input', () => { clearTimeout(autocompleteTimer); highlightIndex = -1; const q = queryInput.value.trim(); if (q.length < 1) { closeDropdown(); return; } autocompleteTimer = setTimeout(() => fetchAutocomplete(q), 200); });

    queryInput.addEventListener('keydown', e => {
      const items = dropdownEl.querySelectorAll('.autocomplete-item');
      if (!items.length) return;
      if (e.key === 'ArrowDown') { e.preventDefault(); highlightIndex = Math.min(highlightIndex + 1, items.length - 1); updateHighlight(items); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); highlightIndex = Math.max(highlightIndex - 1, 0); updateHighlight(items); }
      else if (e.key === 'Enter' && highlightIndex >= 0) { e.preventDefault(); const item = autocompleteResults[highlightIndex]; if (item) { queryInput.value = item.name; closeDropdown(); doSearch(item.name); } }
      else if (e.key === 'Escape') { closeDropdown(); }
    });

    queryInput.addEventListener('blur', () => setTimeout(closeDropdown, 180));
    queryInput.addEventListener('focus', () => { const q = queryInput.value.trim(); if (q.length >= 1 && autocompleteResults.length > 0) dropdownEl.classList.add('open'); });

    async function fetchAutocomplete(q) {
      dropdownEl.innerHTML = '<div class="autocomplete-loading">Searching…</div>'; dropdownEl.classList.add('open');
      try {
        const r = await fetch(`/api/v1/spots/search?q=${encodeURIComponent(q)}`, { headers: { Authorization: `Bearer ${token}` } });
        if (r.status === 401 || r.status === 403) { localStorage.removeItem('token'); window.location.replace('/login'); return; }
        const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Search failed.');
        autocompleteResults = (d || []).slice(0, 6);
        if (!autocompleteResults.length) { dropdownEl.innerHTML = '<div class="autocomplete-empty">No suggestions found</div>'; }
        else {
          dropdownEl.innerHTML = autocompleteResults.map((s, i) => `<div class="autocomplete-item" data-index="${i}" onclick="selectAutocomplete(${i})"><div style="flex:1;min-width:0;"><div class="name">${escapeHtml(s.name)}</div><div class="addr">${escapeHtml(s.type)} · ${escapeHtml(s.address)}</div></div><span class="type-pill">${escapeHtml(s.type)}</span></div>`).join('');
          highlightIndex = -1;
        }
      } catch(e) { dropdownEl.innerHTML = '<div class="autocomplete-empty">Error loading suggestions</div>'; }
    }

    function selectAutocomplete(idx) { const item = autocompleteResults[idx]; if (item) { queryInput.value = item.name; closeDropdown(); doSearch(item.name); } }
    function updateHighlight(items) { items.forEach((e, i) => e.classList.toggle('highlighted', i === highlightIndex)); if (highlightIndex >= 0 && items[highlightIndex]) items[highlightIndex].scrollIntoView({ block: 'nearest' }); }
    function closeDropdown() { dropdownEl.classList.remove('open'); highlightIndex = -1; }

    async function doSearch(q) {
      statusEl.className = 'status'; statusEl.textContent = `Searching for "${escapeHtml(q)}"...`; gridEl.innerHTML = '';
      try {
        const r = await fetch(`/api/v1/spots/search?q=${encodeURIComponent(q)}`, { headers: { Authorization: `Bearer ${token}` } });
        if (r.status === 401 || r.status === 403) { localStorage.removeItem('token'); window.location.replace('/login'); return; }
        const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Search failed.');
        renderSpots(d, q);
      } catch (e) { statusEl.className = 'status error'; statusEl.textContent = e.message; }
    }

    function renderSpots(spots, query) {
      if (!spots.length) { statusEl.textContent = `No results for "${escapeHtml(query)}".`; gridEl.innerHTML = '<div class="empty">Try a different search term.</div>'; return; }
      statusEl.textContent = `${spots.length} result${spots.length === 1 ? '' : 's'} for "${escapeHtml(query)}".`;
      gridEl.innerHTML = spots.map(s => `<article class="spot" onclick="window.location='/spot?id=${s.id}'"><div class="spot-head"><div><h2>${highlight(escapeHtml(s.name), query)}</h2><p class="meta">${escapeHtml(s.type)} · ${escapeHtml(s.address)}</p></div><span class="pill">${escapeHtml(s.status)}</span></div><p class="coords">${s.latitude}, ${s.longitude}</p><div class="tags">${(s.tags || []).map(t => `<span class="tag">${highlight(escapeHtml(t), query)}</span>`).join('')}</div></article>`).join('');
    }

    function highlight(text, q) { if (!q) return text; return text.replace(new RegExp(`(${escapeRegex(q)})`, 'gi'), '<span class="highlight">$1</span>'); }
    function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
    function escapeHtml(v) { return String(v ?? '').replaceAll('&','&').replaceAll('<','<').replaceAll('>','>').replaceAll('"','"').replaceAll("'",'&#039;'); }

    const params = new URLSearchParams(window.location.search);
    const initialQ = params.get('q');
    if (initialQ) { queryInput.value = initialQ; doSearch(initialQ); }
  </script>
</body>
</html>

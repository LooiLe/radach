<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spot — Radach</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --paper:#F7F3EE; --ink:#1C1C1C; --muted:#756E66;
      --line:#E8E2DA; --brand:#C4623A; --brand-dark:#A8502F;
      --ok:#2D7A40; --bad:#C0392B; --warn:#E67E22; --card:#FFFFFF;
    }
    body { min-height:100vh; font-family:'DM Sans',sans-serif; background:var(--paper); color:var(--ink); }
    .topbar {
      height:72px; padding:0 32px; display:flex; align-items:center; justify-content:space-between;
      border-bottom:1px solid var(--line); background:rgba(247,243,238,0.96); position:sticky; top:0; z-index:100;
    }
    .topbar-left { display:flex; align-items:center; gap:16px; }
    .topbar h2 { font-family:'Playfair Display',serif; font-size:1.3rem; font-weight:900; cursor:pointer; }
    .hamburger {
      background:none; border:none; font-size:1.6rem; cursor:pointer; padding:4px; border-radius:8px;
      display:flex; align-items:center; justify-content:center; width:40px; height:40px; transition:background 0.15s;
    }
    .hamburger:hover { background:var(--line); }
    .topbar-actions { display:flex; gap:10px; align-items:center; }

    /* Hamburger dropdown menu */
    .menu-overlay {
      display:none; position:fixed; inset:0; z-index:10000;
    }
    .menu-overlay.open { display:block; }
    .menu-dropdown {
      position:fixed; top:72px; left:0; z-index:10001;
      background:#fff; border-right:1px solid var(--line); border-bottom:1px solid var(--line);
      border-radius:0 0 12px 0; box-shadow:4px 4px 20px rgba(0,0,0,0.1);
      padding:12px 0; min-width:200px; display:none; flex-direction:column;
    }
    .menu-dropdown.open { display:flex; }
    .menu-link {
      display:flex; align-items:center; gap:12px; padding:14px 20px; text-decoration:none;
      color:var(--muted); font-size:0.9rem; font-weight:600; transition:all 0.12s; border:none; background:none;
      width:100%; text-align:left; font-family:'DM Sans',sans-serif; cursor:pointer;
    }
    .menu-link:hover { background:#f5f0ea; color:var(--ink); }
    .menu-link.active { color:var(--brand); }
    .menu-link .icon { font-size:1.1rem; }
    .menu-divider { height:1px; background:var(--line); margin:6px 12px; }

    .logo { display:flex; align-items:center; text-decoration:none; }
    .logo-img { height:36px; width:auto; display:block; }

    button, .link-button {
      border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:8px; padding:10px 14px;
      font:inherit; font-size:0.9rem; font-weight:700; cursor:pointer; text-decoration:none;
    }
    button:hover, .link-button:hover { border-color:var(--ink); }
    .primary { background:var(--brand); border-color:var(--brand); color:#fff; }
    .primary:hover { background:var(--brand-dark); border-color:var(--brand-dark); }
    .primary:disabled { opacity:0.5; cursor:not-allowed; }

    main { max-width:900px; margin:0; padding:36px 32px 64px; }
    .back { display:inline-flex; align-items:center; gap:6px; color:var(--muted); text-decoration:none; font-size:0.92rem; margin-bottom:24px; }
    .back:hover { color:var(--ink); }
    .spot-header { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:28px; margin-bottom:24px; }
    .spot-header h1 { font-family:'Playfair Display',serif; font-size:clamp(1.6rem,3vw,2.4rem); font-weight:900; margin-bottom:8px; }
    .spot-meta { display:flex; gap:16px; flex-wrap:wrap; color:var(--muted); font-size:0.92rem; margin-bottom:14px; }
    .spot-meta span { display:flex; align-items:center; gap:4px; }
    .tags { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px; }
    .tag { border:1px solid var(--line); border-radius:999px; padding:5px 9px; font-size:0.78rem; color:var(--muted); }
    .action-btns { display:flex; gap:10px; }
    .action-btns button { flex:1; display:flex; align-items:center; justify-content:center; gap:6px; }
    .section-title { font-family:'Playfair Display',serif; font-size:1.3rem; font-weight:900; margin-bottom:16px; margin-top:32px; }
    .review-form { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:20px; margin-bottom:24px; }
    .review-form textarea {
      width:100%; border:1px solid var(--line); border-radius:8px; padding:12px; font:inherit;
      min-height:90px; resize:vertical; outline:none;
    }
    .review-form textarea:focus { border-color:var(--ink); }
    .review-form .rating-row { display:flex; gap:8px; align-items:center; margin:12px 0; }
    .star { font-size:1.5rem; cursor:pointer; color:#E0D8CE; transition:color 0.15s; }
    .star.active, .star:hover { color:#F5A623; }
    .review-form .submit-row { display:flex; gap:12px; align-items:center; }
    .review-card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:18px; margin-bottom:12px; }
    .review-head { display:flex; justify-content:space-between; gap:12px; margin-bottom:8px; }
    .review-type-badge {
      border-radius:999px; padding:4px 8px; font-size:0.7rem; font-weight:700; text-transform:uppercase;
    }
    .review-type-badge.expert { background:#FEF2E7; color:var(--warn); border:1px solid #FDE6CC; }
    .review-type-badge.user { background:#EFF9F0; color:var(--ok); border:1px solid #C5E8CA; }
    .review-rating { color:#F5A623; font-size:0.92rem; margin-bottom:6px; }
    .review-body { line-height:1.55; color:var(--ink); margin-bottom:8px; }
    .review-meta { color:var(--muted); font-size:0.82rem; }
    .review-actions { margin-top:8px; display:flex; gap:6px; }
    .approve-btn { background:#EFF9F0; color:var(--ok); border:1px solid #C5E8CA; padding:6px 12px; border-radius:6px; font-size:0.8rem; font-weight:600; cursor:pointer; }
    .reject-btn { background:#FEF2F0; color:var(--bad); border:1px solid #F5C6C2; padding:6px 12px; border-radius:6px; font-size:0.8rem; font-weight:600; cursor:pointer; }
    .status-badge {
      border-radius:999px; padding:4px 8px; font-size:0.7rem; font-weight:700; text-transform:uppercase;
    }
    .status-badge.approved { background:#EFF9F0; color:var(--ok); border:1px solid #C5E8CA; }
    .status-badge.pending { background:#FFF8E6; color:var(--warn); border:1px solid #FDE6CC; }
    .status-badge.rejected { background:#FEF2F0; color:var(--bad); border:1px solid #F5C6C2; }
    .filter-bar { display:flex; gap:8px; margin-bottom:16px; }
    .filter-btn {
      border:1px solid var(--line); border-radius:8px; padding:7px 14px;
      font:inherit; font-size:0.85rem; cursor:pointer; background:#fff; color:var(--muted);
    }
    .filter-btn.active { background:var(--ink); color:white; border-color:var(--ink); }
    .empty { border:1px dashed var(--line); border-radius:8px; padding:32px; text-align:center; color:var(--muted); background:rgba(255,255,255,0.55); }
    .msg { margin-top:8px; padding:8px 12px; border-radius:6px; font-size:0.85rem; display:none; }
    .msg.error { display:block; background:#FEF2F0; color:var(--bad); border:1px solid #F5C6C2; }
    .msg.success { display:block; background:#EFF9F0; color:var(--ok); border:1px solid #C5E8CA; }
    @media (max-width:640px) {
      main { padding:24px 16px; }
      .spot-meta { flex-direction:column; gap:6px; }
      .action-btns { flex-direction:column; }
    }
  </style>
</head>
<body>
  <!-- Hamburger overlay -->
  <div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>

  <!-- Hamburger dropdown -->
  <nav class="menu-dropdown" id="menuDropdown">
    <a href="/spots" class="menu-link"><span class="icon"></span>All Spots</a>
    <a href="/trending" class="menu-link"><span class="icon"></span>Trending</a>
    <a href="/search" class="menu-link"><span class="icon"></span>Search</a>
    <div class="menu-divider"></div>
    <a href="/admin/dashboard" class="menu-link" id="menuAdminLink" style="display:none"><span class="icon">️</span>Admin</a>
    <a href="/admin/users" class="menu-link" id="menuSuperAdminLink" style="display:none"><span class="icon"></span>Manage Users</a>
    <div class="menu-divider"></div>
    <button class="menu-link" id="menuLogoutBtn"><span class="icon"></span>Sign out</button>
  </nav>

  <div>
    <div class="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="hamburgerBtn" onclick="toggleMenu()"></button>
        <a href="/" class="logo">
          <img src="/images/radach_logo.jpg" alt="Radach Logo" class="logo-img">
        </a>
      </div>
      <div class="topbar-actions">
        <span id="roleBadge" style="font-size:0.78rem; padding:4px 10px; border-radius:999px; background:var(--line); font-weight:700; display:none;"></span>
      </div>
    </div>

    <main>
      <a class="back" href="javascript:history.back()">← Back</a>

      <div id="spotContent">
        <div class="spot-header" id="spotHeader">
          <h1 id="spotName">Loading...</h1>
          <div class="spot-meta">
            <span id="spotType">—</span>
            <span id="spotAddress">—</span>
            <span id="spotCoords">—</span>
            <span id="spotStatus">—</span>
            <span id="spotRating" style="color:#F5A623;font-weight:700;">—</span>
          </div>
          <div class="tags" id="spotTags"></div>
          <div class="action-btns">
            <button class="primary" id="viewBtn"> View on map</button>
            <button class="primary" id="saveBtn" style="display:none"> Save changes</button>
          </div>
        </div>

        <h2 class="section-title"> Reviews</h2>

        <div class="review-form" id="reviewForm">
          <textarea id="reviewBody" placeholder="Write your review..." maxlength="2000"></textarea>
          <div class="rating-row">
            <label>Rating: </label>
            <span class="star" data-value="1"></span>
            <span class="star" data-value="2"></span>
            <span class="star" data-value="3"></span>
            <span class="star" data-value="4"></span>
            <span class="star" data-value="5"></span>
            <span id="ratingDisplay" style="margin-left:8px;font-size:0.85rem;color:var(--muted)">Select a rating</span>
          </div>
          <div class="submit-row">
            <button class="primary" id="submitReviewBtn">Submit review</button>
            <div class="msg" id="reviewMsg"></div>
          </div>
        </div>


        <div id="reviewsList">
          <p class="status" id="reviewsStatus">Loading reviews...</p>
        </div>
      </div>
    </main>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const params = new URLSearchParams(window.location.search);
    const spotId = params.get('id');
    let selectedRating = 0;

    if (!token) {
      window.location.replace('/login');
    }

    // --- Hamburger menu ---
    function toggleMenu() {
      document.getElementById('menuDropdown').classList.toggle('open');
      document.getElementById('menuOverlay').classList.toggle('open');
    }
    function closeMenu() {
      document.getElementById('menuDropdown').classList.remove('open');
      document.getElementById('menuOverlay').classList.remove('open');
    }
    document.getElementById('menuLogoutBtn').addEventListener('click', () => {
      localStorage.removeItem('token');
      localStorage.removeItem('userId');
      localStorage.removeItem('role');
      document.cookie = 'token=; path=/; max-age=0; SameSite=Strict';
      window.location.replace('/login');
    });

    // --- Role-based menu links ---
    (function() {
      let role = (localStorage.getItem('role') || '').toUpperCase();
      if (role !== 'ADMIN' && role !== 'SUPER_ADMIN') {
        try {
          const parts = token.split('.');
          const payload = JSON.parse(atob(parts[1]));
          role = (payload.role || '').toUpperCase();
        } catch (e) {}
      }
      if (role === 'ADMIN' || role === 'SUPER_ADMIN') {
        document.getElementById('menuAdminLink').style.display = '';
        localStorage.setItem('role', role);
      }
      if (role === 'SUPER_ADMIN') {
        document.getElementById('menuSuperAdminLink').style.display = '';
      }
      if (role) {
        const badge = document.getElementById('roleBadge');
        badge.textContent = ' ' + role;
        badge.style.display = '';
      }
    })();

    let currentSpot = null;
    let isAdmin = false;

    async function loadSpot() {
      try {
        const res = await fetch(`/api/v1/spots/${spotId}`, { headers: { Authorization: `Bearer ${token}` } });

        if (res.status === 401 || res.status === 403) {
          localStorage.removeItem('token');
          window.location.replace('/login');
          return;
        }

        const spot = await res.json();
        if (!res.ok) throw new Error(spot.error || 'Could not load spot.');

        currentSpot = spot;
        renderSpot(spot);
      } catch (e) {
        document.getElementById('spotHeader').innerHTML = `<p class="empty">${escapeHtml(e.message)}</p>`;
      }
    }

    function formatRating(rating) {
      if (!rating || rating <= 0) return 'No ratings yet';
      const display = Number.isInteger(rating) ? rating : rating.toFixed(1);
      return ' ' + display + '/5';
    }

    function renderSpot(spot) {
      document.getElementById('spotName').textContent = spot.name;
      document.getElementById('spotType').textContent = spot.type;
      document.getElementById('spotAddress').textContent = spot.address;
      document.getElementById('spotCoords').textContent = `${spot.latitude}, ${spot.longitude}`;
      document.getElementById('spotStatus').textContent = spot.status;
      document.getElementById('spotRating').textContent = formatRating(spot.averageRating);
      document.getElementById('spotTags').innerHTML = (spot.tags || [])
        .map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');

      document.title = `${escapeHtml(spot.name)} — Radach`;

      // View button: go to map with this spot's location
      document.getElementById('viewBtn').addEventListener('click', () => {
        trackEvent('VIEW');
        window.location.href = `/spots?lat=${spot.latitude}&lng=${spot.longitude}&radiusKm=1`;
      });

      // Check role for admin edit & save
      try {
        const parts = token.split('.');
        const payload = JSON.parse(atob(parts[1]));
        const role = (payload.role || '').toUpperCase();
        isAdmin = role === 'ADMIN' || role === 'SUPER_ADMIN';
      } catch (e) {}

      if (isAdmin) {
        // Show Save button
        document.getElementById('saveBtn').style.display = '';

        // Build edit fields (preserve action-btns which contains viewBtn and saveBtn)
        const fieldsContainer = document.createElement('div');
        fieldsContainer.style.cssText = 'display:flex;flex-direction:column;gap:12px;';
        fieldsContainer.innerHTML = `
          <div style="display:flex;gap:12px;">
            <div style="flex:1;">
              <label style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:5px;display:block;">Name</label>
              <input id="spotName" type="text" value="${escapeHtml(spot.name)}" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;font-size:0.85rem;" />
            </div>
            <div style="flex:1;">
              <label style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:5px;display:block;">Type</label>
              <select id="spotType" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;font-size:0.85rem;">
                <option value="Restaurant" ${spot.type === 'Restaurant' ? 'selected' : ''}>Restaurant</option>
                <option value="Food Hall" ${spot.type === 'Food Hall' ? 'selected' : ''}>Food Hall</option>
                <option value="Café" ${spot.type === 'Café' ? 'selected' : ''}>Café</option>
                <option value="Bar" ${spot.type === 'Bar' ? 'selected' : ''}>Bar</option>
                <option value="Market" ${spot.type === 'Market' ? 'selected' : ''}>Market</option>
                <option value="Other" ${spot.type === 'Other' ? 'selected' : ''}>Other</option>
              </select>
            </div>
          </div>
          <div style="position:relative;">
            <label style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:5px;display:block;">Address</label>
            <input id="spotAddress" type="text" value="${escapeHtml(spot.address)}" autocomplete="off" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;font-size:0.85rem;" />
            <div id="addressSuggestions" style="display:none; position:absolute; top:100%; left:0; right:0; z-index:100; background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,0.12); max-height:200px; overflow-y:auto;"></div>
          </div>
          <div style="display:flex;gap:12px;">
            <div style="flex:1;">
              <label style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:5px;display:block;">Latitude</label>
              <input id="spotLat" type="text" value="${spot.latitude}" readonly style="width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;font-size:0.85rem;background:#f5f0ea;color:#756E66;cursor:default;" />
            </div>
            <div style="flex:1;">
              <label style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:5px;display:block;">Longitude</label>
              <input id="spotLng" type="text" value="${spot.longitude}" readonly style="width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;font-size:0.85rem;background:#f5f0ea;color:#756E66;cursor:default;" />
            </div>
          </div>
          <div>
            <label style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:5px;display:block;">Tags (comma separated)</label>
            <input id="spotTags" type="text" value="${(spot.tags || []).join(', ')}" placeholder="thai, trending, cheap" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;font-size:0.85rem;" />
          </div>
          <div>
            <label style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:5px;display:block;">Status</label>
            <select id="spotStatus" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;font-size:0.85rem;">
              <option value="ACTIVE" ${spot.status === 'ACTIVE' ? 'selected' : ''}>Active</option>
              <option value="INACTIVE" ${spot.status === 'INACTIVE' ? 'selected' : ''}>Inactive</option>
              <option value="PENDING" ${spot.status === 'PENDING' ? 'selected' : ''}>Pending review</option>
            </select>
          </div>
        `;

        // Replace only the display elements (h1, .spot-meta, .tags, .action-btns) with the edit form
        // Keep action-btns where it is
        const header = document.getElementById('spotHeader');
        // Remove children except action-btns
        const actionBtns = header.querySelector('.action-btns');
        while (header.firstChild) {
          header.removeChild(header.firstChild);
        }
        header.appendChild(fieldsContainer);
        if (actionBtns) header.appendChild(actionBtns);

        // Wire up address autocomplete (same as admin dashboard)
        const addressInput = document.getElementById('spotAddress');
        const suggestionsEl = document.getElementById('addressSuggestions');
        let geocodeTimer = null;

        addressInput.addEventListener('input', function() {
          clearTimeout(geocodeTimer);
          const q = this.value.trim();
          if (q.length < 3) { suggestionsEl.style.display = 'none'; return; }
          geocodeTimer = setTimeout(async () => {
            try {
              const res = await fetch('https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(q) + '&format=json&limit=5', { headers: { 'Accept-Language': 'en' } });
              const data = await res.json();
              if (!data || data.length === 0) { suggestionsEl.style.display = 'none'; return; }
              suggestionsEl.innerHTML = data.map((p, i) => '<div style="padding:10px 12px; cursor:pointer; border-bottom:1px solid #f0ece6; font-size:0.85rem;" onmouseover="this.style.background=\'#f5f0ea\'" onmouseout="this.style.background=\'\'" onclick="selectEditAddress(' + i + ')"><div style="font-weight:600;">' + escapeHtml(p.display_name.split(',')[0]) + '</div><div style="font-size:0.75rem; color:#756E66; margin-top:2px;">' + escapeHtml(p.display_name) + '</div></div>').join('');
              suggestionsEl.style.display = 'block';
              suggestionsEl._data = data;
            } catch(e) { suggestionsEl.style.display = 'none'; }
          }, 300);
        });
        addressInput.addEventListener('blur', () => { setTimeout(() => { suggestionsEl.style.display = 'none'; }, 200); });
        addressInput.addEventListener('focus', function() { if (suggestionsEl.children.length > 0) suggestionsEl.style.display = 'block'; });

        document.getElementById('saveBtn').addEventListener('click', saveSpot);
      } else {
        document.getElementById('saveBtn').style.display = 'none';
        trackEvent('VIEW');
      }
    }

    function selectEditAddress(index) {
      const el = document.getElementById('addressSuggestions');
      const data = el._data;
      if (!data || !data[index]) return;
      const p = data[index];
      document.getElementById('spotAddress').value = p.display_name;
      document.getElementById('spotLat').value = p.lat;
      document.getElementById('spotLng').value = p.lon;
      el.style.display = 'none';
    }

    async function saveSpot() {
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = 'Saving...';

      const tagsRaw = document.getElementById('spotTags').value.trim();
      const tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : [];

      const body = {
        name: document.getElementById('spotName').value.trim(),
        type: document.getElementById('spotType').value,
        address: document.getElementById('spotAddress').value.trim(),
        latitude: parseFloat(document.getElementById('spotLat').value),
        longitude: parseFloat(document.getElementById('spotLng').value),
        status: document.getElementById('spotStatus').value,
        tags: tags
      };

      try {
        const res = await fetch(`/api/v1/spots/${spotId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (res.ok) {
          currentSpot = data;
          alert('✓ Spot updated successfully!');
        } else {
          alert(data.error || 'Failed to update spot.');
        }
      } catch (e) {
        alert('Could not reach server.');
      }

      btn.disabled = false;
      btn.textContent = ' Save changes';
    }

    async function trackEvent(type) {
      try {
        await fetch(`/api/v1/spots/${spotId}/${type.toLowerCase()}`, {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}` }
        });
      } catch (e) {}
    }

    async function loadReviews() {
      const statusEl = document.getElementById('reviewsStatus');
      statusEl.textContent = 'Loading reviews...';
      statusEl.style.color = 'var(--muted)';

      const url = `/api/v1/spots/${spotId}/reviews?_t=${Date.now()}`;

      try {
        const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Could not load reviews.');

        // data is a Page object; extract .content array; fallback to data if not present
        const reviews = Array.isArray(data.content) ? data.content : (Array.isArray(data) ? data : []);
        renderReviews(reviews);
      } catch (e) {
        document.getElementById('reviewsList').innerHTML = `<p class="empty">${escapeHtml(e.message)}</p>`;
      }
    }

    function renderReviews(reviews) {
      const list = document.getElementById('reviewsList');
      if (!reviews.length) {
        list.innerHTML = `<p class="empty">No reviews yet. Be the first to leave one!</p>`;
        return;
      }

      list.innerHTML = reviews.map(r => `
        <div class="review-card">
          <div class="review-head">
            <span class="review-type-badge ${r.reviewType.toLowerCase()}">
              ${r.reviewType === 'EXPERT' ? '‍ Expert' : ' User'}
            </span>
          </div>
          <div class="review-rating">${''.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</div>
          <div class="review-body">${escapeHtml(r.body)}</div>
          <div class="review-meta">${escapeHtml(r.authorName || 'User #' + r.authorId)} · ${new Date(r.createdAt).toLocaleDateString()}</div>
        </div>
      `).join('');

    }


    document.querySelectorAll('.star').forEach(el => {
      el.addEventListener('click', () => {
        selectedRating = parseInt(el.dataset.value);
        document.querySelectorAll('.star').forEach(s => {
          s.classList.toggle('active', parseInt(s.dataset.value) <= selectedRating);
        });
        document.getElementById('ratingDisplay').textContent = `${selectedRating}/5`;
      });
    });

    document.getElementById('submitReviewBtn').addEventListener('click', async () => {
      const body = document.getElementById('reviewBody').value.trim();
      const msg = document.getElementById('reviewMsg');
      msg.className = 'msg';

      if (!body) {
        msg.className = 'msg error';
        msg.textContent = 'Please write a review.';
        return;
      }
      if (selectedRating === 0) {
        msg.className = 'msg error';
        msg.textContent = 'Please select a rating.';
        return;
      }

      const btn = document.getElementById('submitReviewBtn');
      btn.disabled = true;
      btn.textContent = 'Submitting...';

      try {
        const res = await fetch(`/api/v1/spots/${spotId}/reviews`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify({ body, rating: selectedRating })
        });
        const data = await res.json();

        if (res.ok) {
          msg.className = 'msg success';
          msg.textContent = '✓ Review submitted and is pending admin moderation.';
          document.getElementById('reviewBody').value = '';
          selectedRating = 0;
          document.querySelectorAll('.star').forEach(s => s.classList.remove('active'));
          document.getElementById('ratingDisplay').textContent = 'Select a rating';
          loadReviews();
        } else {
          msg.className = 'msg error';
          msg.textContent = data.error || 'Failed to submit review.';
        }
      } catch (e) {
        msg.className = 'msg error';
        msg.textContent = 'Could not reach server.';
      }

      btn.disabled = false;
      btn.textContent = 'Submit review';
    });


    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&')
        .replaceAll('<', '<')
        .replaceAll('>', '>')
        .replaceAll('"', '"')
        .replaceAll("'", '&#039;');
    }

    loadSpot();
    loadReviews();
  </script>
</body>
</html>
